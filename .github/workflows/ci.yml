name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 ref 只保留一轮：PR 上取消进行中的旧任务，main 上不取消已开始的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # job id 即 ruleset 里 required status checks 的 context（verify），改名前先同步 ruleset
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只跑 pnpm lint（eslint + tsc --noEmit + node --test），不依赖任何机密，
      # fork 提交的 PR 也能正常出结果。
      - name: Verify
        run: pnpm lint

  build:
    # 公开页在构建期读库（ISR 预渲染），需要真实的 Supabase 环境变量；
    # fork 的 PR 拿不到 secrets，所以只在 main 上跑。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
