name: 💡 Feature request
description: 提一个功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先描述问题，再说方案，讨论会容易得多。还比较发散的想法更适合放 [Discussions → Ideas](https://github.com/baiwumm/better-nav/discussions/categories/ideas)。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 首页与分类页
        - 后台管理
        - 登录与权限
        - 数据层 / 接口
        - 部署与环境变量
        - SEO / 元信息
        - 文档与仓库
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 它解决什么问题
      description: 你现在遇到的情况，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 草图、链接、相关 issue 或 discussion。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue、discussion 与 docs。
          required: true
        - label: 这是一个诉求，不是多个需求打包。
          required: true
