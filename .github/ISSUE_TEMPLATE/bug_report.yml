name: 🐞 Bug report
description: 报告一个可复现的问题（首页、分类页、后台、部署）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这个表单用于**可复现的缺陷**。

        使用与部署问题请到 [Discussions Q&A](https://github.com/baiwumm/better-nav/discussions/categories/q-a)；安全问题必须走[私密报告](https://github.com/baiwumm/better-nav/security/advisories/new)。

        **永远不要粘贴密钥** —— Supabase publishable/secret key、`.env` 内容、登录凭据。日志与截图请先脱敏。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 首页展示
        - 分类页
        - 后台管理（分类 / 站点）
        - 登录与权限
        - 部署与环境变量
        - SEO / 元信息
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 站点页脚/package.json 的版本号，或出问题的提交 SHA。
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 你运行在哪
      options:
        - 官方站点（nav.baiwumm.com）
        - 自建部署（Vercel + 自己的 Supabase）
        - 本地开发（pnpm dev）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现与实际表现
      description: 写清期望结果、实际结果，以及控制台或 Network 里的原始报错。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 只贴关键行。先删掉密钥、绝对路径与账号信息。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue、discussion 与 docs。
          required: true
        - label: 我已移除报告里的全部密钥（Supabase key、.env 内容、登录凭据）。
          required: true
