title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        有想法？先说问题，再说方案，讨论起来会容易得多。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 首页与分类页
        - 后台管理
        - 登录与权限
        - 数据层 / 接口
        - 部署与环境变量
        - SEO / 元信息
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 它解决什么问题
      description: 你现在遇到的情况，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 草图、链接、相关 discussion。
  - type: checkboxes
    id: checks
    attributes:
      label: 发布前确认
      options:
        - label: 我已搜索过现有 discussion 与 docs。
          required: true
        - label: 这是一个想法，不是多个需求打包。
          required: true
