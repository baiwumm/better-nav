version: 2

updates:
  # 前端依赖：pnpm 单包，根目录统一处理
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # TS 大版本会同时牵动 tsc 门禁与 typescript-eslint 的支持范围，由人工评估后再升
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  # 工作流里 pin 的 actions 版本（checkout / setup-node / pnpm 等）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
